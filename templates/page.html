<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fcfcfb">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$portrait_url">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="$title">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css?v=$css_hash">
  <script type="application/ld+json">$structured_data</script>
  $analytics
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="/" aria-label="$name — home">$name</a>
    <nav aria-label="Main navigation">$navigation</nav>
  </div></header>
  <main id="main" class="page">$main</main>
  <footer class="site-footer"><span>$name</span><a href="mailto:$email">$email</a></footer>
</body>
</html>
